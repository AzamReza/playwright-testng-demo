# Allure Configuration Properties
# Link patterns to reference external systems (JIRA, GitHub, etc.)

# Link patterns for JIRA (example)
# allure.link.jira.pattern=https://jira.example.com/browse/{}

# Link patterns for GitHub (example)
# allure.link.github.pattern=https://github.com/example/project/issues/{}

# Directory for test results
# This will be automatically set by Maven, but can be overridden here if needed
results.directory=target/allure-results

